name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Imprimir ambiente (Ejemplo Secret)
        run: echo "Ejecutando en el ambiente configurado"
        env:
          APP_ENV: ${{ secrets.APP_ENV_DEMO }}

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and Compile
        run: ./mvnw clean compile

      - name: Run Tests
        run: ./mvnw test

      - name: Generate JaCoCo Report
        run: ./mvnw jacoco:report

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-jacoco
          path: target/site/jacoco/
          retention-days: 7