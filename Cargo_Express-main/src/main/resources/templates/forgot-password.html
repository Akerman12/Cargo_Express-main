<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restablecer Contraseña | SAI CARGO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --brand-blue: #002855;   
            --brand-orange: #FF6600; 
            --light-bg: #F4F7F9;
            --white: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --border-light: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-bg);
            background-image: radial-gradient(#CBD5E1 1.5px, transparent 1.5px);
            background-size: 25px 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-dark);
            padding: 20px;
        }

        .login-card { 
            width: 100%; 
            max-width: 420px; 
            background: var(--white); 
            padding: 45px 40px; 
            border-radius: 16px; 
            box-shadow: 0 20px 50px rgba(0, 40, 85, 0.1); 
            position: relative; 
            border: 1px solid rgba(255,255,255,0.8);
            backdrop-filter: blur(5px);
        }

        .barcode-decor {
            position: absolute;
            top: 0; left: 0;
            height: 6px;
            width: 100%;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            background: repeating-linear-gradient(
                90deg,
                var(--brand-blue),
                var(--brand-blue) 3px,
                transparent 3px,
                transparent 6px,
                var(--brand-orange) 6px,
                var(--brand-orange) 8px,
                transparent 8px,
                transparent 12px
            );
        }

        .login-header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
        .login-header h3 { color: var(--brand-blue); font-size: 24px; font-weight: 800; margin-top: 15px; }
        .login-header p { color: var(--text-muted); font-size: 14px; margin-top: 10px; line-height: 1.5; }

        .brand-logo-card {
            width: 130px;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .floating-group { position: relative; margin-bottom: 22px; width: 100%; }
        .floating-group input { width: 100%; padding: 16px 20px 16px 50px; border: 2px solid var(--border-light); background: #F9FAFB; border-radius: 10px; font-size: 15px; color: var(--text-dark); transition: all 0.3s; outline: none; }
        .floating-group .icon-left { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #94A3B8; font-size: 18px; transition: 0.3s; }
        .floating-group input:focus { border-color: var(--brand-blue); background: var(--white); }
        .floating-group input:focus ~ .icon-left { color: var(--brand-blue); }

        .btn-login { width: 100%; background: var(--brand-orange); color: var(--white); border: none; padding: 16px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-login:hover { background: var(--brand-blue); transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 40, 85, 0.2); }

        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .alert-error { background: #FEE2E2; color: #DC2626; border: 1px solid #FECACA; }
        .alert-success { background: #DCFCE7; color: #166534; border: 1px solid #BBF7D0; }

        .back-link { text-align: center; margin-top: 25px; font-size: 14px; }
        .back-link a { color: var(--brand-blue); font-weight: 700; text-decoration: none; transition: 0.3s; }
        .back-link a:hover { color: var(--brand-orange); }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="barcode-decor"></div>

        <div class="login-header">
            <img src="/imagenes/LOGO Cargo Expres.jpg" alt="SAI CARGO Logo" class="brand-logo-card">
            <h3>¿Olvidaste tu contraseña?</h3>
            <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.</p>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}"></span>
        </div>
        <div th:if="${success}" class="alert alert-success">
            <i class="fa-solid fa-check-circle"></i> <span th:text="${success}"></span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="floating-group">
                <input type="email" name="email" id="email" placeholder="Tu correo electrónico" required autofocus>
                <i class="fa-solid fa-envelope icon-left"></i>
            </div>

            <button type="submit" class="btn-login">
                ENVIAR ENLACE <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <div class="back-link">
            <a th:href="@{/login}"><i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión</a>
        </div>
    </div>

</body>
</html>
