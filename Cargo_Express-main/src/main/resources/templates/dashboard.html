<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analítico | SAI CARGO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/sai-theme.css}">

    <style>
        :root {
            --brand-blue: #002855;
            --brand-orange: #FF6600;
            --bg-main: #F4F7F9;
            --white: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --border-light: #E2E8F0;
            
            --success-bg: #DCFCE7;
            --success-text: #166534;

            --shadow-sm: 0 2px 4px rgba(0, 40, 85, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 40, 85, 0.06);
            --shadow-lg: 0 20px 40px rgba(0, 40, 85, 0.1);
        }

        .floating-lang {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 2000;
            display: flex;
            gap: 10px;
            background: var(--white);
            padding: 8px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid var(--border-light);
        }

        .lang-item {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: 0.3s;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .lang-item:hover { transform: scale(1.1); border-color: var(--brand-blue); }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-orange); }

        /* --- SIDEBAR CORPORATIVO --- */
        .sidebar {
            width: 270px; background: var(--white); border-right: 1px solid var(--border-light); padding: 30px 20px; position: fixed; height: 100vh; display: flex; flex-direction: column; z-index: 100; box-shadow: var(--shadow-sm);
        }
        .sidebar-logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border-light); }
        .sidebar-logo img { width: 140px; height: auto; transition: 0.3s; }
        .sidebar-logo img:hover { transform: scale(1.05); }

        .nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin: 15px 0 10px 15px; font-weight: 700; }
        .sidebar a { color: var(--text-muted); text-decoration: none; padding: 12px 16px; border-radius: 10px; transition: all 0.3s ease; display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 14px; margin-bottom: 5px; }
        .sidebar a i { font-size: 18px; width: 20px; text-align: center; }
        .sidebar a:hover, .sidebar a.active { background: var(--bg-main); color: var(--brand-blue); }
        .sidebar a.btn-highlight { background: var(--brand-blue); color: var(--white); margin-top: 10px; box-shadow: 0 4px 12px rgba(0, 40, 85, 0.2); }
        .sidebar a.btn-highlight:hover { background: var(--brand-blue-light); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0, 40, 85, 0.3); }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-content { 
            margin-left: 270px; 
            flex: 1; 
            padding: 40px 50px; 
            display: flex; 
            flex-direction: column; 
            max-width: calc(100vw - 270px);
            height: 100vh;
        }

        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header-title h1 { font-size: 28px; color: var(--brand-blue); font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
        .header-title p { color: var(--text-muted); font-size: 14px; }

        .user-pill { background: var(--white); padding: 8px 25px; border-radius: 50px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); transition: 0.3s; cursor: pointer; text-decoration: none; }
        .user-pill:hover { box-shadow: var(--shadow-md); border-color: #CBD5E1; }

        /* --- CONTENEDOR DASHBOARD --- */
        .dashboard-wrapper {
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            flex: 1;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .dashboard-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--bg-main);
        }

        .dashboard-toolbar h2 {
            font-size: 18px;
            color: var(--brand-blue);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .dashboard-toolbar h2 i { color: var(--brand-orange); }

        .live-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--success-bg);
            color: var(--success-text);
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid #BBF7D0;
            letter-spacing: 0.5px;
        }

        .dot-pulse {
            width: 8px;
            height: 8px;
            background: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        /* Power BI Iframe Container */
        .powerbi-container {
            flex: 1;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-main);
            border: 1px solid var(--border-light);
            position: relative;
        }

        .powerbi-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer-info {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        

        @media (max-width: 768px) {
            .dashboard-toolbar { flex-direction: column; align-items: flex-start; gap: 15px; }
            .powerbi-container { min-height: 400px; } /* Ajuste de altura para móviles */
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/sai-sidebar :: sidebar('menu')}"></div>

    <main class="main-content">
        
        <div class="top-header">
            <div class="header-title">
                <h1>Analítica y Reportes</h1>
                <p>Monitoreo inteligente de operaciones logísticas y flujos de inventario.</p>
            </div>
            
            <a th:href="@{/usuario/perfil}" class="user-pill">
                <div style="text-align: right">
                    <div style="font-weight: 700; font-size: 14px; color: var(--brand-blue);" th:text="${#authentication.name}">Operador</div>
                    <span style="font-size: 11px; color: var(--text-muted); font-weight: 600;">VER PERFIL</span>
                </div>
                <i class="fa-solid fa-circle-user" style="font-size: 36px; color: var(--brand-blue-light);"></i>
            </a>
        </div>

        <div class="dashboard-wrapper">
            
            <div class="dashboard-toolbar">
                <h2><i class="fa-solid fa-chart-column"></i> Rendimiento General (Power BI)</h2>
                <div class="live-status">
                    <div class="dot-pulse"></div>
                    CONEXIÓN EN VIVO
                </div>
            </div>

            <div class="powerbi-container">
                <iframe title="san andres cargo express" 
                        src="https://app.powerbi.com/view?r=eyJrIjoiMGJmZDFlODQtZWUzMC00MzgyLTg5MzctZjcwNGI5YTI3ZTZmIiwidCI6IjlkMTJiZjNmLWU0ZjYtNDdhYi05MTJmLTFhMmYwZmM0OGFhNCIsImMiOjR9" 
                        allowFullScreen="true">
                </iframe>
            </div>

            <div class="footer-info">
                <i class="fa-solid fa-shield-halved" style="color: var(--brand-blue-light);"></i>
                Reporte de control logístico cifrado e integrado vía Microsoft Power BI.
            </div>

        </div>
    </main>

</body>
</html>
