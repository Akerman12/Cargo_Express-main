<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario | Gestión Administrativa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/jpg" th:href="@{/imagenes/LOGO Cargo Expres.jpg}">
    <link rel="stylesheet" th:href="@{/css/sai-theme.css}">
    <style>
        :root {
            --brand-blue: #002855;
            --brand-blue-light: #004085;
            --brand-orange: #FF6600;
            --bg-main: #F4F7F9;
            --white: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --border-light: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-main); color: var(--text-dark); display: flex; min-height: 100vh; }
        
        .sidebar { width: 270px; background: var(--white); border-right: 1px solid var(--border-light); padding: 30px 20px; position: fixed; height: 100vh; }
        .sidebar-logo img { width: 140px; margin-bottom: 40px; display: block; margin-left: auto; margin-right: auto; }
        .sidebar a { color: var(--text-muted); text-decoration: none; padding: 12px 16px; border-radius: 10px; display: flex; align-items: center; gap: 15px; font-weight: 600; margin-bottom: 5px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: var(--bg-main); color: var(--brand-blue); }
        
        .main-content { margin-left: 270px; flex: 1; padding: 40px 50px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 600px; margin-bottom: 35px; text-align: left; }
        .header h1 { font-size: 26px; color: var(--brand-blue); font-weight: 800; }
        .header p { color: var(--text-muted); font-size: 14px; }

        .edit-card { 
            background: var(--white); 
            width: 100%;
            max-width: 600px;
            border-radius: 24px; 
            padding: 40px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.05); 
            border: 1px solid var(--border-light);
        }

        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--brand-blue); margin-bottom: 10px; letter-spacing: 0.5px; }
        
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-wrapper input, .input-wrapper select { 
            width: 100%; 
            padding: 15px 15px 15px 50px; 
            border: 2px solid #F1F5F9; 
            border-radius: 14px; 
            font-size: 14px; 
            font-family: inherit;
            color: var(--text-dark);
            outline: none;
            transition: 0.3s;
        }
        .input-wrapper input:focus, .input-wrapper select:focus { border-color: var(--brand-blue); box-shadow: 0 0 0 4px rgba(0,40,133,0.05); }

        .btn-save { 
            width: 100%; 
            background: var(--brand-blue); 
            color: white; 
            padding: 16px; 
            border-radius: 14px; 
            border: none; 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(0,40,133,0.15);
        }
        .btn-save:hover { background: var(--brand-blue-light); transform: translateY(-2px); box-shadow: 0 15px 30px rgba(0,40,133,0.2); }

        .back-link { 
            margin-top: 25px; 
            color: var(--text-muted); 
            text-decoration: none; 
            font-size: 13px; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .back-link:hover { color: var(--brand-blue); }

        .info-box {
            background: #F8FAFC;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            border-left: 4px solid var(--brand-orange);
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sai-sidebar :: sidebar('usuarios')}"></div>

    <main class="main-content">
        <div class="header">
            <h1>Editar Perfil de Usuario</h1>
            <p>Modifica credenciales, roles y datos corporativos de forma segura.</p>
        </div>

        <div class="edit-card">
            <form th:action="@{/admin/usuarios/editar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{id}">
                
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" th:field="*{nombre}" required placeholder="Ej: Juan Pérez">
                    </div>
                </div>

                <div class="form-group">
                    <label>Usuario (Correo de Acceso)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" th:field="*{username}" required placeholder="correo@empresa.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>Correo de Notificaciones</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-at"></i>
                        <input type="email" th:field="*{email}" placeholder="opcional@empresa.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>Asignación de Rol</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user-shield"></i>
                        <select th:field="*{rol}">
                            <option value="ROLE_CLIENTE">Usuario Cliente</option>
                            <option value="ROLE_REPARTIDOR">Repartidor Oficial</option>
                            <option value="ROLE_ADMIN">Administrador del Sistema</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" id="regionGroup">
                    <label>Región de Operación (solo repartidores)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-map-location-dot"></i>
                        <select th:field="*{regionOperacion}">
                            <option value="">— Sin región —</option>
                            <option th:each="r : ${regiones}" th:value="${r.name()}" th:text="${r.etiqueta}"></option>
                        </select>
                    </div>
                </div>

                <div class="info-box">
                    <i class="fa-solid fa-circle-info"></i> Deja el campo de contraseña vacío si no deseas cambiarla.
                </div>

                <div class="form-group">
                    <label>Nueva Contraseña (Opcional)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" name="newPassword" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn-save">GUARDAR CAMBIOS</button>
            </form>
        </div>

        <a th:href="@{/admin/usuarios}" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Cancelar y volver al listado
        </a>
    </main>
</body>
</html>
