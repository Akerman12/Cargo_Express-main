<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría de Pagos | SAI CARGO ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/jpg" th:href="@{/imagenes/LOGO Cargo Expres.jpg}">
    <link rel="stylesheet" th:href="@{/css/sai-theme.css}">
    
    <style>
        :root {
            --brand-blue: #002855;
            --brand-orange: #FF6600;
            --bg-main: #F4F7F9;
            --white: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --success: #10B981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body { background-color: var(--bg-main); color: var(--text-dark); display: flex; min-height: 100vh; }

        /* --- SIDEBAR --- */
        .sidebar { width: 270px; background: var(--white); border-right: 1px solid var(--border); padding: 30px 20px; position: fixed; height: 100vh; }
        .sidebar-logo img { width: 140px; margin-bottom: 30px; display: block; margin-left: auto; margin-right: auto; }
        .sidebar a { color: var(--text-muted); text-decoration: none; padding: 12px 16px; border-radius: 10px; display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 14px; margin-bottom: 5px; }
        .sidebar a:hover, .sidebar a.active { background: var(--bg-main); color: var(--brand-blue); }

        /* --- MAIN --- */
        .main-content { margin-left: 270px; flex: 1; padding: 40px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        .header h1 { font-size: 26px; font-weight: 800; color: var(--brand-blue); }

        /* --- ACCUMULATED CARD --- */
        .accumulated-card {
            background: linear-gradient(135deg, var(--brand-blue) 0%, var(--brand-blue-light, #1A4D80) 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 40, 85, 0.2);
        }
        .accumulated-card h2 { font-size: 32px; font-weight: 900; }
        .accumulated-card p { font-size: 14px; opacity: 0.8; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        /* --- TABLE --- */
        .table-card { background: var(--white); border-radius: 20px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; font-size: 12px; text-transform: uppercase; color: var(--text-muted); border-bottom: 2px solid var(--bg-main); }
        td { padding: 15px; border-bottom: 1px solid var(--bg-main); font-size: 14px; font-weight: 500; }

        .method-badge {
            background: #f0f4ff;
            color: var(--brand-blue);
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 800;
        }

        .btn-back { display: inline-flex; align-items: center; gap: 8px; color: var(--brand-blue); text-decoration: none; font-weight: 700; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div th:replace="~{fragments/sai-sidebar :: sidebar('pagos')}"></div>

    <main class="main-content">
        <a th:href="@{/menu}" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Volver al Menú</a>
        
        <div class="header">
            <h1>Libro Mayor de Recaudos</h1>
            <p style="color: var(--text-muted); font-size: 14px;">Control financiero y verificación de ingresos en tiempo real.</p>
        </div>

        <div class="accumulated-card">
            <div>
                <p>Total Acumulado en Caja</p>
                <h2 th:text="${isSupremo ? '$' + #numbers.formatDecimal(totalAcumulado, 1, 2) : '$***'}">$0</h2>
            </div>
            <i class="fa-solid fa-vault" style="font-size: 50px; opacity: 0.3;"></i>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>ID Pago</th>
                        <th>Guía #</th>
                        <th>Pagador / Titular</th>
                        <th>Método</th>
                        <th>Monto Recibido</th>
                        <th>Fecha / Hora</th>
                        <th style="text-align: center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pago : ${pagos}">
                        <td th:text="'#' + ${pago.id}"></td>
                        <td style="font-weight: 800; color: var(--brand-blue);" th:text="'SAI-' + ${pago.guia.id}"></td>
                        <td>
                            <div th:text="${isSupremo ? pago.titular : (#strings.length(pago.titular) > 3 ? #strings.substring(pago.titular,0,3) + '***' : '***')}" style="font-weight: 700;"></div>
                            <div style="font-size: 11px; color: var(--text-muted);" th:text="${isSupremo ? 'Cliente: ' + pago.guia.usuario.nombre : 'Cliente: ***'}"></div>
                        </td>
                        <td>
                            <span class="method-badge" th:text="${pago.metodo}"></span>
                        </td>
                        <td style="color: var(--success); font-weight: 800;" th:text="${isSupremo ? '$' + #numbers.formatDecimal(pago.monto, 1, 2) : '$***'}"></td>
                        <td th:text="${#temporals.format(pago.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                        <td style="text-align: center;">
                            <a th:href="@{/pago/recibo/{id}(id=${pago.guia.id})}" class="action-btn" style="background: #e0f2fe; color: #0369a1; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; border: 1px solid #bae6fd;">
                                <i class="fa-solid fa-file-pdf"></i> RECIBO
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pagos)}">
                        <td colspan="6" style="text-align: center; padding: 50px; color: var(--text-muted);">No se han registrado pagos en el sistema todavía.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
