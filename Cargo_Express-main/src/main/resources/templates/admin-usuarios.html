<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios | SAI CARGO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/jpg" th:href="@{/imagenes/LOGO Cargo Expres.jpg}">
    <link rel="stylesheet" th:href="@{/css/sai-theme.css}">
    <style>
        :root {
            --brand-blue: #002855;
            --brand-orange: #FF6600;
            --bg-main: #F4F7F9;
            --white: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --border-light: #E2E8F0;
            --success: #166534;
            --danger: #991B1B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-main); color: var(--text-dark); display: flex; min-height: 100vh; }
        
        .sidebar { width: 270px; background: var(--white); border-right: 1px solid var(--border-light); padding: 30px 20px; position: fixed; height: 100vh; }
        .sidebar-logo img { width: 140px; margin-bottom: 40px; display: block; margin-left: auto; margin-right: auto; }
        .sidebar a { color: var(--text-muted); text-decoration: none; padding: 12px 16px; border-radius: 10px; display: flex; align-items: center; gap: 15px; font-weight: 600; margin-bottom: 5px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: var(--bg-main); color: var(--brand-blue); }
        
        .main-content { margin-left: 270px; flex: 1; padding: 40px 50px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        .header h1 { font-size: 26px; color: var(--brand-blue); font-weight: 800; }

        .table-card { background: var(--white); border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border-light); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; font-size: 12px; text-transform: uppercase; color: var(--text-muted); border-bottom: 2px solid var(--border-light); }
        td { padding: 15px; border-bottom: 1px solid #F1F5F9; font-size: 14px; }
        
        .badge { padding: 5px 12px; border-radius: 50px; font-size: 11px; font-weight: 700; }
        .badge-active { background: #DCFCE7; color: #166534; }
        .badge-blocked { background: #FEE2E2; color: #991B1B; }
        
        .btn { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.3s; font-size: 12px; }
        .btn-approve { background: var(--success); color: white; }
        .btn-block { background: var(--danger); color: white; }
        .btn-edit { background: var(--brand-blue); color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }

        .alert { padding: 15px; border-radius: 10px; margin-bottom: 20px; font-weight: 600; }
        .alert-success { background: #DCFCE7; color: #166534; border: 1px solid #BBF7D0; }
        .alert-error { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }

        .actions-cell {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sai-sidebar :: sidebar('usuarios')}"></div>

    <main class="main-content">
        <div class="header">
            <h1>Control de Accesos y Usuarios</h1>
        </div>

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Usuario</th>
                        <th>Rol</th>
                        <th>Región</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${usuarios}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.nombre}" style="font-weight: 700;"></td>
                        <td th:text="${user.username}"></td>
                        <td>
                            <span th:text="${user.rol.displayName}" style="color: var(--brand-blue); font-weight: 600;"></span>
                        </td>
                        <td>
                            <span th:if="${user.regionOperacion != null}" th:text="${user.regionOperacion.etiqueta}" style="font-weight: 600;"></span>
                            <span th:if="${user.regionOperacion == null and user.rol.name() == \'ROLE_REPARTIDOR\'}" style="color: #b45309; font-weight: 700;">⚠ Sin región</span>
                        </td>
                        <td>
                            <span th:if="${user.aprobado}" class="badge badge-active">ACTIVO</span>
                            <span th:unless="${user.aprobado}" class="badge badge-blocked">BLOQUEADO</span>
                        </td>
                        <td class="actions-cell">
                            <a th:href="@{/admin/usuarios/editar/{id}(id=${user.id})}" class="btn btn-edit">
                                <i class="fa-solid fa-pen-to-square"></i> EDITAR
                            </a>
                            <form th:if="${!user.aprobado}" th:action="@{/admin/usuarios/aprobar/{id}(id=${user.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-approve">APROBAR</button>
                            </form>
                            <form th:if="${user.aprobado && user.username != #authentication.name}" th:action="@{/admin/usuarios/bloquear/{id}(id=${user.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-block">BLOQUEAR</button>
                            </form>
                            <!-- Solo mostrar eliminar si no es admin, o si el que está logueado es el SUPREMO -->
                            <form th:if="${user.username != #authentication.name && (user.rol.name() != 'ROLE_ADMIN' || #authentication.name == 'admin@saicargo.com')}" 
                                  th:action="@{/admin/usuarios/eliminar/{id}(id=${user.id})}" method="post" style="display:inline;" 
                                  onsubmit="return confirm('¿ESTÁS SEGURO? Esta acción es irreversible.');">
                                <button type="submit" class="btn btn-block" style="background: #000;">
                                    <i class="fa-solid fa-trash-can"></i> ELIMINAR
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
