<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nueva Contraseña | SAI CARGO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --brand-blue: #002855;   
            --brand-orange: #FF6600; 
            --light-bg: #F4F7F9;
            --white: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --border-light: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-bg);
            background-image: radial-gradient(#CBD5E1 1.5px, transparent 1.5px);
            background-size: 25px 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-dark);
            padding: 20px;
        }

        .login-card { 
            width: 100%; 
            max-width: 420px; 
            background: var(--white); 
            padding: 45px 40px; 
            border-radius: 16px; 
            box-shadow: 0 20px 50px rgba(0, 40, 85, 0.1); 
            position: relative; 
            border: 1px solid rgba(255,255,255,0.8);
            backdrop-filter: blur(5px);
        }

        .barcode-decor {
            position: absolute;
            top: 0; left: 0;
            height: 6px;
            width: 100%;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            background: repeating-linear-gradient(
                90deg,
                var(--brand-blue),
                var(--brand-blue) 3px,
                transparent 3px,
                transparent 6px,
                var(--brand-orange) 6px,
                var(--brand-orange) 8px,
                transparent 8px,
                transparent 12px
            );
        }

        .login-header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
        .login-header h3 { color: var(--brand-blue); font-size: 24px; font-weight: 800; margin-top: 15px; }
        .login-header p { color: var(--text-muted); font-size: 14px; margin-top: 10px; }

        .brand-logo-card {
            width: 130px;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .floating-group { position: relative; margin-bottom: 22px; width: 100%; }
        .floating-group input { width: 100%; padding: 16px 20px 16px 50px; border: 2px solid var(--border-light); background: #F9FAFB; border-radius: 10px; font-size: 15px; color: var(--text-dark); transition: all 0.3s; outline: none; }
        .floating-group .icon-left { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #94A3B8; font-size: 18px; transition: 0.3s; }
        .floating-group .icon-right { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #94A3B8; cursor: pointer; transition: 0.3s; }
        .floating-group input:focus { border-color: var(--brand-blue); background: var(--white); }
        .floating-group input:focus ~ .icon-left { color: var(--brand-blue); }

        .btn-login { width: 100%; background: var(--brand-orange); color: var(--white); border: none; padding: 16px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-login:hover { background: var(--brand-blue); transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 40, 85, 0.2); }

        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .alert-error { background: #FEE2E2; color: #DC2626; border: 1px solid #FECACA; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="barcode-decor"></div>

        <div class="login-header">
            <img src="/imagenes/LOGO Cargo Expres.jpg" alt="SAI CARGO Logo" class="brand-logo-card">
            <h3>Nueva Contraseña</h3>
            <p>Ingresa tu nueva clave de acceso.</p>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/reset-password}" method="post" id="resetForm">
            <input type="hidden" name="token" th:value="${token}">
            
            <div class="floating-group">
                <input type="password" name="password" id="password" placeholder="Nueva contraseña" required minlength="6">
                <i class="fa-solid fa-lock icon-left"></i>
                <i class="fa-solid fa-eye icon-right" id="togglePassword" onclick="togglePass()"></i>
            </div>

            <div class="floating-group">
                <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required minlength="6">
                <i class="fa-solid fa-shield-check icon-left"></i>
            </div>

            <button type="submit" class="btn-login">
                ACTUALIZAR CONTRASEÑA <i class="fa-solid fa-key"></i>
            </button>
        </form>
    </div>

    <script>
        function togglePass() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('togglePassword');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        document.getElementById('resetForm').onsubmit = function(e) {
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (pass !== confirm) {
                alert("Las contraseñas no coinciden.");
                e.preventDefault();
            }
        };
    </script>
</body>
</html>
