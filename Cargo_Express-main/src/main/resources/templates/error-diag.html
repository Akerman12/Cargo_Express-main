<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del Sistema | SAI CARGO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --brand-blue: #002855;
            --brand-orange: #FF6600;
            --white: #FFFFFF;
            --bg-main: #F4F7F9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-main); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            text-align: center;
            padding: 20px;
        }
        .error-card {
            background: var(--white);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,40,85,0.1);
            max-width: 500px;
            width: 100%;
        }
        .icon-box {
            font-size: 80px;
            color: var(--brand-orange);
            margin-bottom: 20px;
        }
        h1 { color: var(--brand-blue); font-weight: 800; margin-bottom: 10px; }
        p { color: #64748B; margin-bottom: 30px; font-size: 15px; }
        .btn-home {
            background: var(--brand-blue);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 700;
            display: inline-block;
            transition: 0.3s;
        }
        .btn-home:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,40,85,0.2); }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="icon-box">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1 th:text="${status != null ? status : 'Error'}">404</h1>
        <p>¡Oops! Algo no salió como esperábamos. Es posible que el recurso no esté disponible o haya ocurrido un fallo temporal.</p>
        <a th:href="@{/menu}" class="btn-home">VOLVER AL INICIO</a>
    </div>
</body>
</html>
